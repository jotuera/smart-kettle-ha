name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Card, languages, blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Languages complete and card up to date
        run: python3 tools/build_i18n.py --check
      - name: Card syntax
        run: node --check dist/smart-kettle-card.js
      - name: Card logic (mocked Home Assistant) and other ecosystems
        run: |
          node tests/test_card.js
          node tests/test_brands.js
      - name: Card and integration find the same entities and profiles for every kettle
        run: python3 tests/test_roles.py
      - name: Integration – bundled card and translations up to date, Python compiles
        run: |
          python3 tools/build_integration.py --check
          python3 -m py_compile custom_components/smart_kettle/*.py tools/*.py
      - name: YAML files parse
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import glob, yaml
          class L(yaml.SafeLoader): pass
          L.add_constructor("!input", lambda l, n: l.construct_scalar(n))
          for f in glob.glob("blueprints/**/*.yaml", recursive=True) + glob.glob("packages/*.yaml") + glob.glob(".github/**/*.yml", recursive=True):
              yaml.load(open(f, encoding="utf-8"), Loader=L); print("ok", f)
          PY

  hassfest:
    name: hassfest (Home Assistant integration validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    # the action can only validate public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # PolyForm Noncommercial is not recognised by GitHub (SPDX NOASSERTION) – fine for a custom repository
          ignore: brands description topics license
